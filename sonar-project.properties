# projectKey y organization los asigna SonarCloud al importar el repo. Si no
# coinciden exactamente, el análisis falla con "Project not found".
sonar.projectKey=frankhz28_2026-II-CS-UNI-SoftwareQuality-Code
sonar.organization=frankhz28

sonar.projectName=ResilientOps
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=**/node_modules/**,.next/**,coverage/**,**/*.test.ts,**/*.test.tsx

# Los tests viven junto al código, no en una carpeta aparte.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Requiere el reporter 'lcov' en vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
